<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GestãoVendas Pro - Modular</title>
  
  <!-- Configuração PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <!-- Suporte para instalação no iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GestãoVendas">
  <link rel="apple-touch-icon" href="./icon.svg">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Tela de Login (Exibida quando não há usuário logado) -->
  <div id="auth-view" class="auth-wrapper"></div>

  <!-- Sistema Principal (Oculto até o login ser feito) -->
  <div id="app-layout" class="app-layout hidden">
    <nav class="sidebar">
      <div class="brand">
        <h2>Gestão de<span> Vendas</span></h2>
      </div>
      <ul class="nav-links">
        <li><button class="nav-btn active" data-module="dashboard">📊 Resumo</button></li>
        <li><button class="nav-btn" data-module="vendas">🛒 Vendas</button></li>
        <li><button class="nav-btn" data-module="produtos">📦 Produtos</button></li>
        <li><button class="nav-btn" data-module="clientes">👥 Clientes</button></li>
        <li><button class="nav-btn" data-module="usuarios" data-role="admin">🔐 Usuários</button></li>
        <li><button class="nav-btn" data-route="suporte">🛠️ Suporte</button></li>
      </ul>
    </nav>

    <main class="main-content">
      <header class="topbar">
        <h1 id="module-title">Resumo Geral</h1>
        <div class="topbar-actions">
          <span id="user-display" class="user-tag"></span>
          <button id="logout-btn" class="btn-logout">Sair</button>
        </div>
      </header>
      
      <section id="app-view" class="view-container"></section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
